<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Saasbox - Multipurpose HTML Template for Saas &amp; Agency">
    <!-- Title-->
    <title>Saasbox - Multipurpose HTML Template for Saas &amp; Agency</title>
    <!-- Favicon-->
    <link rel="shortcut icon" href="img/core-img/favicon.ico" type="image/x-icon">
    <!-- All CSS Stylesheet-->
    <link rel="stylesheet" href="css/all-css-libraries.css">
    <!-- Core Stylesheet-->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Preloader-->
    <div class="preloader" id="preloader">
      <div class="spinner-grow text-light" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <!-- Header Area-->
    <div id="header-placeholder"></div>
    <!-- Breadcrumb Area-->
    <div class="breadcrumb-wrapper bg-img bg-overlay" style="background-image: url('img/bg-img/12.jpg');">
      <div class="container h-100">
        <div class="row h-100 align-items-center">
          <div class="col-12">
            <div class="breadcrumb-content">
              <h2 class="breadcrumb-title">Register</h2>
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center">
                  <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Register</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mb-120 d-block"></div>
    <!-- Register -->
    <div class="register-area">
      <div class="container">
        <div class="row g-4 g-lg-5 align-items-center justify-content-between">
          <div class="col-12 col-lg-6">
            <div class="register-thumbnail"><img src="img/illustrator/1.png" alt=""></div>
          </div>
          <div class="col-12 col-lg-6">
            <div class="card register-card bg-gray p-2 p-sm-4">
              <div class="card-body">
                <h4>Create your free account</h4>
                <p>Already have an account?<a class="ms-2" href="login.html">Log In</a></p>
                <!-- Register Form-->
                <div class="register-form my-5">
                  <form action="#" method="post">
                    <div class="form-group mb-3">
                      <input class="form-control rounded-0" type="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group mb-3">
                      <input class="form-control rounded-0" type="text" placeholder="Full Name" required>
                    </div>
                    <div class="form-group mb-3">
                      <label class="label-psswd" for="registerPassword">Show</label>
                      <input class="form-control rounded-0" id="registerPassword" type="password" placeholder="Password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Register Now</button>
                  </form>
                </div>
                <!-- Sign in via others-->
                <div class="signin-via-others">
                  <p class="mb-0">Or Sign in with</p><a class="btn btn-primary btn-sm mt-3 me-3" href="#"><i class="bi bi-facebook me-2"></i>Facebook</a><a class="btn btn-primary btn-sm mt-3 me-3" href="#"><i class="bi bi-twitter me-2"></i>Twitter</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mb-120 d-block"></div>
    <!-- Footer Area-->
    <div id="footer-placeholder"></div>
    <!-- All JavaScript Files-->
    <script src="js/components.js"></script>
    <script src="js/all-js-libraries.js"></script>
    <script src="js/active.js"></script>
  </body>
</html>
