<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="P&T Mediaworks - Putting things together">
    <!-- Title-->
    <title>P&T Mediaworks - Putting things together </title>
    <!-- Favicon-->
    <link rel="shortcut icon" href="img/core-img/favicon.ico" type="image/x-icon">
    <!-- All CSS Stylesheet-->
    <link rel="stylesheet" href="css/all-css-libraries.css">
    <!-- Core Stylesheet-->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Preloader-->
    <div class="preloader" id="preloader">
      <div class="spinner-grow text-light" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <!-- Header Area-->
    <div id="header-placeholder"></div>
    <!-- Breadcrumb Area-->
    <div class="breadcrumb-wrapper bg-img bg-overlay" style="background-image: url('img/bg-img/12.jpg');">
      <div class="container h-100">
        <div class="row h-100 align-items-center">
          <div class="col-12">
            <div class="breadcrumb-content">
              <h2 class="breadcrumb-title">Contact Us</h2>
              
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mb-120 d-block"></div>
    <!-- Contact Area-->
    <div class="saasbox-contact-us-area">
      <div class="container">                       
        <div class="row g-4 justify-content-between">
          <!-- Contact Side Info-->
          <div class="col-12 col-lg-5 col-xl-4">
            <div class="contact-side-info mb-4 mb-md-0">
              <h1 class="mb-3">Let's talk about <br> all things!</h1>
              <p class="mb-4">Write to us or give us a call. We will reply to you as soon as possible. But yes, it can take up to 24 hours.</p>
              <div class="contact-mini-card-wrapper">
                <!-- Contact Mini Card-->
                <div class="contact-mini-card">
                  <div class="contact-mini-card-icon"><i class="bi bi-envelope"></i></div>
                  <p>help@pntmediaworks.com</p>
                </div>
                <!-- Contact Mini Card-->
                <div class="contact-mini-card">
                  <div class="contact-mini-card-icon"><i class="bi bi-headphones"></i></div>
                  <p>(+27) 82 392 7059</p>
                </div>
                <!-- Contact Mini Card-->
                <div class="contact-mini-card">
                  <div class="contact-mini-card-icon"><i class="bi bi-tag"></i></div>
                  <p>We are open from 8am — 5pm business days.</p>
                </div>
              </div>
            </div>
          </div>
          <!-- Contact Form-->
          <div class="col-12 col-lg-7">
            <div class="contact-form">
              <form action="#" method="POST">
                <div class="row">
                  <div class="col-12 col-lg-6">
                    <label class="form-label" for="name">Full Name:</label>
                    <input class="form-control mb-30" id="name" type="text" placeholder="Designing World" value="" name="name" required>
                  </div>
                  <div class="col-12 col-lg-6">
                    <label class="form-label" for="email">Email Address:</label>
                    <input class="form-control mb-30" id="email" type="email" placeholder="care.designingworld@gmail.com" name="email" value="" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="subject">Topics:</label>
                    <input class="form-control mb-30" id="topics" type="text" placeholder="Presale Questions" name="topics" value="">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="message">Message:</label>
                    <textarea class="form-control mb-30" id="message" name="message" placeholder="Message"></textarea>
                  </div>
                  <div class="col-12 text-center">
                    <button class="btn btn-primary w-100" type="submit">Send Now</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mb-120 d-block"></div>
    
    <div class="mb-120 d-block"></div>
    <!-- Footer Area-->
    <div id="footer-placeholder"></div>
    <div class="mb-120 d-block"></div>
    <!-- All JavaScript Files-->
    <script src="js/components.js"></script>
    <script src="js/all-js-libraries.js"></script>
    <script src="js/active.js"></script>
  </body>
</html>
